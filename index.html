<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Hunger Games</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23100f14' stroke='%23c9a227' stroke-width='2'/%3E%3Cpath d='M16 7 L12 18 l3-1 -2 9 5-7 5 7 -2-9 3 1z' fill='%23f0d98a'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles/main.css?v=25" />
<link rel="stylesheet" href="styles/animations.css?v=25" />
</head>
<body>
  <canvas id="ember-field" aria-hidden="true"></canvas>

  <main id="app" role="main">
    <!-- Les écrans sont injectés ici par le routeur -->
  </main>

  <div id="cannon-flash" aria-hidden="true"></div>
  <div id="phase-wipe" aria-hidden="true"></div>

  <!-- Barre d'outils flottante (son / voix / plein écran) -->
  <div id="toolbar" aria-hidden="false">
    <button id="btn-sound" type="button" title="Activer / couper le son" aria-label="Son">♪</button>
    <button id="btn-fullscreen" type="button" title="Plein écran" aria-label="Plein écran">🗖</button>
  </div>

  <!-- Barre d'actions d'écran (retour / continuer) -->
  <div id="actions" hidden></div>

  <!-- Barre de lecture (vitesse / auto / pas-à-pas) -->
  <div id="playbar" hidden></div>

  <!-- Conteneur de fenêtres modales -->
  <div id="modal-root" hidden></div>

  <!-- Chargement des scripts. Le ?v=N force le navigateur à recharger
       après une modification : incrémenter N à chaque mise à jour du code. -->
  <script>
  (function () {
    var V = "25";
    var FILES = [
      "src/data.js", "src/rng.js", "src/audio.js", "src/storage.js", "src/voice.js",
      "src/state.js", "src/ui.js",
      "src/engine/weapons.js",
      "src/engine/tributes.js", "src/engine/commentary.js", "src/engine/events.js",
      "src/engine/deaths.js", "src/engine/combat.js", "src/engine/odds.js",
      "src/engine/simulation.js",
      "src/screens/home.js", "src/screens/roster.js", "src/screens/prelude.js",
      "src/screens/bloodbath.js", "src/screens/round.js", "src/screens/fallen.js",
      "src/screens/victory.js",
      "src/main.js"
    ];
    var extra = location.search ? "&" + location.search.slice(1) : "";
    FILES.forEach(function (f) {
      document.write('<script src="' + f + '?v=' + V + extra + '"><\/script>');
    });
  })();
  </script>
</body>
</html>
